<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    body {
      background-color: #f7f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

      font-family: Georgia, Cambria, "Times New Roman", Times, serif;
      color: #0d8275;
    }
    .bevel-box {
      background: #eceff1;
      border: 1px solid #c7cbcf;
      box-shadow: inset 1px 1px 2px rgba(255,255,255,0.9), inset -1px -1px 2px rgba(0,0,0,0.12);
    }
    .bar-track {
      background: #cfd4d9;
      box-shadow: inset 1px 1px 2px rgba(0,0,0,0.25);
    }
    .status-text-ready {
      color: #2e7d32;
      font-weight: 700;
    }
    .vu-meter-bar {
      width: 4px;
      background: #94a3b8;
      border-radius: 1px;
      transition: height 0.08s ease;
    }
  </style>
</head>
<body class="p-4 md:p-10 text-slate-800">

  <div class="max-w-6xl mx-auto">
    <!-- Header del examen -->
    <header class="flex items-center justify-between pb-4 border-b border-slate-300 mb-6">
      <h1 class="serif-title text-2xl md:text-3xl italic font-bold">
        Speaking and Listening: <span class="not-italic font-semibold text-slate-800">Retell the Story</span>
      </h1>
      <div class="flex items-center gap-2 text-slate-600 font-semibold text-sm">
        <i class="fa-solid fa-globe text-teal-700 text-lg"></i>
        <span>English</span>
      </div>
    </header>

    <!-- Selector de Ejercicios -->
    <div class="mb-6 flex flex-wrap items-center justify-between gap-3 bg-white p-3.5 rounded-lg border border-slate-300 shadow-sm">
      <div class="flex items-center gap-2">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Select Item:</span>
        <select id="exerciseSelector" onchange="changeExercise(this.value)" class="text-sm font-semibold bg-slate-50 border border-slate-300 rounded px-3 py-1.5 focus:ring-2 focus:ring-teal-600 outline-none text-slate-700 cursor-pointer">
          <option value="0">Story 1: Emma in Paris (AUDIOUNO)</option>
          <option value="1">Story 2: David's Half-Marathon (AUDIODOS)</option>
          <option value="2">Story 3: Sophie and Mark's Kitchen (AUDIOTRES)</option>
          <option value="3">Story 4: Lucas's Puppy (AUDIOCUATRO)</option>
          <option value="4">Story 5: Julian's Mystery Novel (AUDIOCINCO)</option>
          <option value="5">Story 6: Valeria's Candle Store (AUDIOSEIS)</option>
          <option value="6">Story 7: Grandpa's Garden (AUDIOSIETE)</option>
          <option value="7">Story 8: Leo's Live Gig (AUDIOOCHO)</option>
          <option value="8">Story 9: Camila's Computer (AUDIONUEVE)</option>
          <option value="9">Story 10: Daniel's Healthy Habit (AUDIODIEZ)</option>
        </select>
      </div>

      <div class="flex items-center gap-2 text-xs text-slate-500">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-teal-600"></span>
        <span id="currentAudioFileLabel" class="font-mono font-medium text-slate-600">AUDIOUNO</span>
      </div>
    </div>

    <!-- Contenedor Principal -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      
      <!-- Columna Izquierda: Altavoz + Módulos -->
      <div class="lg:col-span-8 flex flex-col sm:flex-row gap-6">
        
        <!-- Altavoz del examen -->
        <div class="flex flex-col items-center justify-start pt-4 text-center sm:w-32 flex-shrink-0">
          <button id="speakerIconBtn" onclick="playCurrentAudio()" title="Click to hear recording" class="focus:outline-none transition-transform hover:scale-105 active:scale
